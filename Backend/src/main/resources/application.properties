spring.application.name=trainingmanagement

# Server
server.port=8080

# MySQL database connection
spring.datasource.url=jdbc:mysql://localhost:3306/government_training_db
spring.datasource.username=root
# Replace with your MySQL password, or set the MYSQL_PASSWORD environment variable
spring.datasource.password=${MYSQL_PASSWORD:}

# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# Jackson - format dates as yyyy-MM-dd
spring.jackson.date-format=yyyy-MM-dd